  # 4. OBJECTION HANDLING: Addressing Customer Hesitations / Cost Concerns
  # =========================================================================
  - check_id: "CHK_BEHAV_BB_005_OBJECTION_HANDLING"
    retailer: "TANGENT_BROADBAND"
    name: "Modem Cost & Delivery Objection Handling"
    type: "BEHAVIOUR"
    version: "1.0.0"
    critical: false
    effective_from: "2026-01-01"
    effective_to: null
    description: "Evaluates agent responsiveness when customer asks about modem extra costs."
    criteria:
      category: "OBJECTION_HANDLING"
      concept: "reassuring customer about zero modem fees and delivery timeframe"
      min_confidence: 0.85
      synthetic_status: "SYNTHETIC_BEHAVIOUR_SPECIFICATION"
      synthetic_rationale: "Agent clearly states $0 free modem in utt_010 -> PASS."
